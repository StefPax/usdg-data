name: Daily USDG snapshot

# Reads every chain's USDG contract on that chain, records the day, rebuilds
# public/usdg-data.json and publishes it. The Framer page reads that file, so
# this is the only moving part in the whole setup.

on:
  schedule:
    # 01:15 UTC — after the UTC day rolls over, and off the hour to dodge the
    # scheduling pile-up that delays a lot of cron runs on GitHub.
    - cron: "15 1 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        required: true
        default: snapshot
        type: choice
        options:
          - snapshot # read the chains and record today (same as the daily run)
          - backfill # fill days missing from the history, from DefiLlama
          - dry-run # read the chains and report, write and publish nothing
      timestamp:
        description: "Snapshot mode only — Unix seconds to record by hand (blank = today)"
        required: false
      value:
        description: "Snapshot mode only — total in USD (required with a timestamp)"
        required: false

concurrency:
  group: usdg-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Without this Python buffers its own output while the build step it
      # shells out to writes straight through, so the log reads out of order
      # and is misleading exactly when you're trying to diagnose a failure.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the pipeline's own tests still pass
        run: python3 test_pipeline.py

      - name: Run
        run: |
          case "${{ inputs.mode || 'snapshot' }}" in
            backfill)
              python3 snapshot_usdg.py --backfill
              ;;
            dry-run)
              python3 snapshot_usdg.py --dry-run
              ;;
            *)
              if [ -n "${{ inputs.timestamp }}" ]; then
                python3 snapshot_usdg.py "${{ inputs.timestamp }}" "${{ inputs.value }}"
              else
                python3 snapshot_usdg.py
              fi
              ;;
          esac

      - name: Sanity-check the generated payload
        if: inputs.mode != 'dry-run'
        run: |
          python3 - <<'PY'
          import json, datetime as dt
          d = json.load(open("public/usdg-data.json"))
          assert d["schema"] == 1, "unexpected schema version"
          assert d["chains"], "no chains in payload"
          assert len(d["series"]) > 300, "chart series looks truncated"
          assert sum(c["value"] for c in d["chains"]) == d["total"], "chains do not sum to total"
          gaps = [(a, b) for (a, _), (b, _) in zip(d["series"], d["series"][1:]) if b - a > 86400]
          if gaps:
              f = lambda t: dt.datetime.fromtimestamp(t, dt.timezone.utc).strftime("%Y-%m-%d")
              print("::warning::chart has %d gap(s), e.g. %s -> %s. "
                    "Re-run this workflow with mode=backfill."
                    % (len(gaps), f(gaps[0][0]), f(gaps[0][1])))
          print(f"payload ok: ${d['total']:,} across {len(d['chains'])} chains, as of {d['asOf']}")
          PY

      - name: Commit the updated history
        if: inputs.mode != 'dry-run'
        run: |
          git config user.name  "usdg-snapshot[bot]"
          git config user.email "usdg-snapshot[bot]@users.noreply.github.com"
          # Stage each file only if it exists: usdg_chains.json isn't created
          # until the first snapshot run, and `git add` fails the whole step on
          # a path that doesn't match anything.
          for f in usdg_all.json usdg_chains.json public/usdg-data.json; do
            if [ -f "$f" ]; then git add -- "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "nothing changed today"
          else
            git commit -m "USDG snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        if: inputs.mode != 'dry-run'
        with:
          path: public

  # Publishing. Using GitHub Pages; for Cloudflare Pages instead, delete this
  # job and the upload-pages-artifact step above, and add to the job above:
  #
  #   - uses: cloudflare/wrangler-action@v3
  #     with:
  #       apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  #       accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  #       command: pages deploy public --project-name=usdg-data
  deploy:
    needs: snapshot
    if: inputs.mode != 'dry-run'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
